name: Sync production files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Apply production changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          site_version = 'v2.7.0'
          new_label = 'Доступно для отгрузки клиенту-план'

          # index.html: keep only one analytics parser/renderer.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Загрузите 3 файла', 'Загрузите 2 файла')
          s = s.replace('План продаж, СММТ и PPTX-шаблон. Файлы сохраняются в браузере.', 'План продаж и PPTX-шаблон. Файлы сохраняются в браузере.')
          s = s.replace('0 / 3', '0 / 2')
          s = re.sub(r'\s*<label class="drop-card" id="smmtCard">.*?</label>\s*', '\n          ', s, count=1, flags=re.S)
          s = re.sub(r'(<label class="drop-card" id="templateCard">.*?<span class="file-index">)03(</span>)', r'\g<1>02\2', s, count=1, flags=re.S)
          s = s.replace('<div class="heading-title-row"><div class="breadcrumb">АТОМ · КОММЕРЧЕСКИЙ ШТАБ</div><h1>Производство и продажи</h1></div>', '<div class="heading-title-row"><h1>S&amp;OP09 plan</h1></div>')
          s = re.sub(r'\s*<script src="\./template-view\.js\?v=[^"]+"></script>\s*', '\n  ', s)
          s = re.sub(r'\s*<script src="\./b2c-details\.js\?v=[^"]+"></script>\s*', '\n  ', s)
          s = re.sub(r'\s*<script src="\./period-filter\.js\?v=[^"]+"></script>\s*', '\n  ', s)
          if 'template-view-v3.js' not in s:
              s = s.replace('<script src="./app.js?v=3.1.1"></script>', '<script src="./template-view-v3.js?v=3.0.0"></script>\n  <script src="./app.js?v=3.2.0"></script>')
          else:
              s = re.sub(r'template-view-v3\.js\?v=[^"\']+', 'template-view-v3.js?v=3.0.0', s)
              s = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=3.2.0', s)
          s = re.sub(r'pptx-template-export\.js\?v=[^"\']+', 'pptx-template-export.js?v=2.7.0', s)
          s = re.sub(r'Версия v\d+\.\d+\.\d+', f'Версия {site_version}', s)
          p.write_text(s, encoding='utf-8')

          # app.js: expose current parsed model to PPTX export, preventing a second XLSX parse.
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          if 'window.ATOMCurrentModel=' not in s:
              s = s.replace('window.ATOMCurrentFiles={sales:null,template:null};', 'window.ATOMCurrentFiles={sales:null,template:null};\nwindow.ATOMCurrentModel=null;')
          s = s.replace('S.model=await window.ATOMTemplateView.renderFromFile(S.salesFile,S.templateFile.name);\n    saveModel();', 'S.model=await window.ATOMTemplateView.renderFromFile(S.salesFile,S.templateFile.name);\n    window.ATOMCurrentModel=S.model;\n    saveModel();')
          s = s.replace('S.model=cached.model;\n      window.ATOMTemplateView.renderModel', 'S.model=cached.model;\n      window.ATOMCurrentModel=S.model;\n      window.ATOMTemplateView.renderModel')
          p.write_text(s, encoding='utf-8')

          # PPTX export: use current model first; parse Excel only as fallback.
          p = Path('pptx-template-export.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Отгрузка клиенту ПЛАН', new_label)
          s = s.replace('    free:normalizeMetric(model.metrics?.free),\n', '    free:null,\n')
          s = s.replace('  if(/свободн.*сток|доступно.*конец|^доступно$/.test(s))return m.free;\n', '  if(/свободн.*сток|доступно.*конец|^доступно$/.test(s))return null;\n')
          s = s.replace("    ['Забронировано клиентами',m.booked,/забронировано/],\n    ['Свободный сток / доступно',m.free,/свободн.*сток|доступно/]\n", "    ['Забронировано клиентами',m.booked,/забронировано/]\n")
          s = s.replace("  changed+=setKpiNearLabel(doc,/^свободный сток$/,m.free);\n", '')
          s = re.sub(r"\+'_v2\.\d+\.pptx'", "+'_v2.7.pptx'", s)
          s = s.replace('    await ensureXLSX();await ensureJSZip();', '    await ensureJSZip();')
          s = re.sub(
              r"const \[salesBuf,tplBuf\]=await Promise\.all\(\[sales\.arrayBuffer\(\),template\.arrayBuffer\(\)\]\);\s*const model=parseCurrentModel\(salesBuf\);",
              "const tplBuf=await template.arrayBuffer();\n    let model=window.ATOMCurrentModel||null;\n    if(!model){await ensureXLSX();const salesBuf=await sales.arrayBuffer();model=parseCurrentModel(salesBuf);}",
              s,
              count=1
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check template-view-v3.js
          node --check pptx-template-export.js
          node --check app.js

      - name: Validate production wiring
        run: |
          grep -q 'template-view-v3.js?v=3.0.0' index.html
          ! grep -q 'b2c-details.js' index.html
          ! grep -q 'period-filter.js' index.html
          ! grep -q 'template-view.js?v=' index.html
          grep -q 'Версия v2.7.0' index.html
          grep -q 'S&amp;OP09 plan' index.html
          grep -q 'window.ATOMCurrentModel' app.js

      - name: Commit production files
        run: |
          if git diff --quiet -- index.html app.js pptx-template-export.js; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js pptx-template-export.js
          git commit -m "Optimize production frontend v2.7.0"
          git push origin HEAD:main
