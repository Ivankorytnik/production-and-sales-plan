name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare production build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          NEW_LABEL = 'Доступно для отгрузки клиенту-план'

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('Загрузите 3 файла', 'Загрузите 2 файла')
          s = s.replace('План продаж, СММТ и PPTX-шаблон. Файлы сохраняются в браузере.', 'План продаж и PPTX-шаблон. Файлы сохраняются в браузере.')
          s = s.replace('0 / 3', '0 / 2')
          s = re.sub(r'\s*<label class="drop-card" id="smmtCard">.*?</label>\s*', '\n          ', s, count=1, flags=re.S)
          s = re.sub(r'(<label class="drop-card" id="templateCard">.*?<span class="file-index">)03(</span>)', r'\g<1>02\2', s, count=1, flags=re.S)
          s = s.replace('period-filter.js?v=1.3.0', 'period-filter.js?v=1.5.0')
          s = s.replace('pptx-template-export.js?v=2.1.0', 'pptx-template-export.js?v=2.4.0')
          s = s.replace('Версия v2.5.9', 'Версия v2.6.3')
          index.write_text(s, encoding='utf-8')

          view = Path('template-view.js')
          t = view.read_text(encoding='utf-8')
          t = t.replace("if(sourceTitle)sourceTitle.textContent='Загрузите 3 файла';", "if(sourceTitle)sourceTitle.textContent='Загрузите 2 файла';")
          t = t.replace("if(sourceText)sourceText.textContent='План продаж, СММТ и PPTX-шаблон. Файлы сохраняются в браузере.';", "if(sourceText)sourceText.textContent='План продаж и PPTX-шаблон. Файлы сохраняются в браузере.';")
          t = t.replace("if(templateIndex)templateIndex.textContent='03';", "if(templateIndex)templateIndex.textContent='02';")
          t = t.replace("if(uploadGrid&&!$('smmtCard')){", "if(false){")
          t = t.replace('`${loaded} / 3`', '`${loaded} / 2`')
          t = t.replace('loaded===3', 'loaded===2')
          view.write_text(t, encoding='utf-8')

          period = Path('period-filter.js')
          f = period.read_text(encoding='utf-8')
          f = f.replace('Отгрузка клиенту ПЛАН', NEW_LABEL)
          period.write_text(f, encoding='utf-8')

          pptx = Path('pptx-template-export.js')
          p = pptx.read_text(encoding='utf-8')
          p = p.replace('Отгрузка клиенту ПЛАН', NEW_LABEL)
          p = p.replace('    free:normalizeMetric(model.metrics?.free),\n', '    free:null,\n')
          p = p.replace('  if(/свободн.*сток|доступно.*конец|^доступно$/.test(s))return m.free;\n', '  if(/свободн.*сток|доступно.*конец|^доступно$/.test(s))return null;\n')
          p = p.replace("    ['Забронировано клиентами',m.booked,/забронировано/],\n    ['Свободный сток / доступно',m.free,/свободн.*сток|доступно/]\n", "    ['Забронировано клиентами',m.booked,/забронировано/]\n")
          p = p.replace("+'_v2.2.pptx'", "+'_v2.4.pptx'")
          pptx.write_text(p, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
