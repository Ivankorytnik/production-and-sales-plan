name: Sync production files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Apply production changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          site_version = 'v2.7.2'
          new_label = 'Доступно для отгрузки клиенту-план'

          # index.html: keep one analytics parser/renderer and move top navigation into the left sidebar.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Загрузите 3 файла', 'Загрузите 2 файла')
          s = s.replace('План продаж, СММТ и PPTX-шаблон. Файлы сохраняются в браузере.', 'План продаж и PPTX-шаблон. Файлы сохраняются в браузере.')
          s = s.replace('0 / 3', '0 / 2')
          s = re.sub(r'\s*<label class="drop-card" id="smmtCard">.*?</label>\s*', '\n          ', s, count=1, flags=re.S)
          s = re.sub(r'(<label class="drop-card" id="templateCard">.*?<span class="file-index">)03(</span>)', r'\g<1>02\2', s, count=1, flags=re.S)
          s = s.replace('<div class="heading-title-row"><div class="breadcrumb">АТОМ · КОММЕРЧЕСКИЙ ШТАБ</div><h1>Производство и продажи</h1></div>', '<div class="heading-title-row"><h1>S&amp;OP09 plan</h1></div>')

          # Remove the old top bar completely.
          s = re.sub(r'\s*<header class="appbar no-print">.*?</header>\s*', '\n', s, count=1, flags=re.S)

          sidebar = '''
        <div class="sidebar-shell-nav">
          <a class="sidebar-brand" href="#top"><strong>АТОМ</strong><span>КОММЕРЧЕСКИЙ ШТАБ</span></a>
          <nav class="sidebar-main-nav"><a href="#sources">Исходные данные</a><a href="#report" class="active">Аналитика</a></nav>
          <div class="user-nav sidebar-user-nav"><span>Версия v2.7.2</span><span>Обновлено <span id="updatedAt">17.09.2026</span></span><span id="authUserBox" class="auth-user"></span></div>
        </div>'''
          if 'sidebar-shell-nav' not in s:
              s = s.replace('<section id="sources" class="source-block no-print">', '<section id="sources" class="source-block no-print">' + sidebar, 1)

          sidebar_css = '''
  <style id="sidebar-nav-style">
    .appbar{display:none!important}
    .sidebar-shell-nav{display:flex;flex-direction:column;gap:16px;padding:2px 0 20px;margin-bottom:20px;border-bottom:1px solid #e5e7eb;font-family:Arial,Helvetica,sans-serif}
    .sidebar-brand{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:#101828}
    .sidebar-brand strong{font-size:22px;line-height:1;font-weight:800;letter-spacing:.3px}
    .sidebar-brand span{font-size:10px;font-weight:700;letter-spacing:1.25px;color:#667085}
    .sidebar-main-nav{display:grid;gap:6px}
    .sidebar-main-nav a{display:flex;align-items:center;min-height:38px;padding:0 11px;border-radius:8px;text-decoration:none;color:#475467;font-size:13px;font-weight:700}
    .sidebar-main-nav a:hover{background:#f4f6f8;color:#101828}
    .sidebar-main-nav a.active{background:#111318;color:#fff}
    .sidebar-user-nav{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:7px!important;color:#667085;font-size:11px;line-height:1.35}
    .sidebar-user-nav>.divider{display:none!important}
    .sidebar-user-nav>.auth-user{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:7px!important;margin-top:3px}
    .sidebar-user-nav .auth-user-email{font-size:11px!important;overflow-wrap:anywhere;color:#475467!important}
    .sidebar-user-nav .auth-logout{width:100%;height:34px;background:#fff}
  </style>'''
          if 'sidebar-nav-style' not in s:
              s = s.replace('</head>', sidebar_css + '\n</head>', 1)

          s = re.sub(r'\s*<script src="\./template-view\.js\?v=[^"]+"></script>\s*', '\n  ', s)
          s = re.sub(r'\s*<script src="\./b2c-details\.js\?v=[^"]+"></script>\s*', '\n  ', s)
          s = re.sub(r'\s*<script src="\./period-filter\.js\?v=[^"]+"></script>\s*', '\n  ', s)
          if 'template-view-v3.js' not in s:
              s = s.replace('<script src="./app.js?v=3.1.1"></script>', '<script src="./template-view-v3.js?v=3.0.1"></script>\n  <script src="./app.js?v=3.2.1"></script>')
          else:
              s = re.sub(r'template-view-v3\.js\?v=[^"\']+', 'template-view-v3.js?v=3.0.1', s)
              s = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=3.2.1', s)
          s = re.sub(r'pptx-template-export\.js\?v=[^"\']+', 'pptx-template-export.js?v=2.7.0', s)
          s = re.sub(r'Версия v\d+\.\d+\.\d+', f'Версия {site_version}', s)
          p.write_text(s, encoding='utf-8')

          # Main analytics renderer: keep the optimized v3 parser.
          p = Path('template-view-v3.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const PARSER_VERSION='3.0.0';", "const PARSER_VERSION='3.0.1';")
          s = s.replace(
              "<div class=\"analytics-head\"><div><h2>Аналитика</h2><div class=\"analytics-subtitle\">Производство, продажи и распределение</div></div><div class=\"analytics-data-date\">Данные на ${esc(date)}</div></div>",
              "<div class=\"analytics-head analytics-head-date-only\"><div class=\"analytics-data-date\">Данные на ${esc(date)}</div></div>"
          )
          if '.analytics-head-date-only' not in s:
              s = s.replace(
                  '.period-control-group{display:flex!important;',
                  '.analytics-head-date-only{display:flex!important;justify-content:flex-end!important;margin-bottom:18px!important}.period-control-group{display:flex!important;'
              )
          p.write_text(s, encoding='utf-8')

          # app.js: expose current parsed model and let the source/sidebar occupy the full viewport height.
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          if 'window.ATOMCurrentModel=' not in s:
              s = s.replace('window.ATOMCurrentFiles={sales:null,template:null};', 'window.ATOMCurrentFiles={sales:null,template:null};\nwindow.ATOMCurrentModel=null;')
          s = s.replace('S.model=await window.ATOMTemplateView.renderFromFile(S.salesFile,S.templateFile.name);\n    saveModel();', 'S.model=await window.ATOMTemplateView.renderFromFile(S.salesFile,S.templateFile.name);\n    window.ATOMCurrentModel=S.model;\n    saveModel();')
          s = s.replace('S.model=cached.model;\n      window.ATOMTemplateView.renderModel', 'S.model=cached.model;\n      window.ATOMCurrentModel=S.model;\n      window.ATOMTemplateView.renderModel')
          s = s.replace('top:58px!important', 'top:0!important')
          s = s.replace('#sources .source-counter{position:absolute!important;top:20px!important;right:18px!important;height:32px!important;min-width:54px!important;font-size:12px!important}', '#sources .source-counter{position:static!important;align-self:flex-start!important;height:32px!important;min-width:54px!important;font-size:12px!important}')
          p.write_text(s, encoding='utf-8')

          # PPTX export: use current model first; parse Excel only as fallback.
          p = Path('pptx-template-export.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Отгрузка клиенту ПЛАН', new_label)
          s = s.replace('    free:normalizeMetric(model.metrics?.free),\n', '    free:null,\n')
          s = s.replace('  if(/свободн.*сток|доступно.*конец|^доступно$/.test(s))return m.free;\n', '  if(/свободн.*сток|доступно.*конец|^доступно$/.test(s))return null;\n')
          s = s.replace("    ['Забронировано клиентами',m.booked,/забронировано/],\n    ['Свободный сток / доступно',m.free,/свободн.*сток|доступно/]\n", "    ['Забронировано клиентами',m.booked,/забронировано/]\n")
          s = s.replace("  changed+=setKpiNearLabel(doc,/^свободный сток$/,m.free);\n", '')
          s = re.sub(r"\+'_v2\.\d+\.pptx'", "+'_v2.7.pptx'", s)
          s = s.replace('    await ensureXLSX();await ensureJSZip();', '    await ensureJSZip();')
          s = re.sub(
              r"const \[salesBuf,tplBuf\]=await Promise\.all\(\[sales\.arrayBuffer\(\),template\.arrayBuffer\(\)\]\);\s*const model=parseCurrentModel\(salesBuf\);",
              "const tplBuf=await template.arrayBuffer();\n    let model=window.ATOMCurrentModel||null;\n    if(!model){await ensureXLSX();const salesBuf=await sales.arrayBuffer();model=parseCurrentModel(salesBuf);}",
              s,
              count=1
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check template-view-v3.js
          node --check pptx-template-export.js
          node --check app.js

      - name: Validate production wiring
        run: |
          grep -q 'template-view-v3.js?v=3.0.1' index.html
          ! grep -q 'b2c-details.js' index.html
          ! grep -q 'period-filter.js' index.html
          ! grep -q 'template-view.js?v=' index.html
          grep -q 'Версия v2.7.2' index.html
          grep -q 'S&amp;OP09 plan' index.html
          grep -q 'sidebar-shell-nav' index.html
          ! grep -q '<header class="appbar no-print">' index.html
          grep -q 'window.ATOMCurrentModel' app.js
          ! grep -q '<h2>Аналитика</h2>' template-view-v3.js
          ! grep -q 'Производство, продажи и распределение' template-view-v3.js

      - name: Commit production files
        run: |
          if git diff --quiet -- index.html template-view-v3.js app.js pptx-template-export.js; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html template-view-v3.js app.js pptx-template-export.js
          git commit -m "Move header navigation to sidebar v2.7.2"
          git push origin HEAD:main
