name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Stamp frontend versions
        run: |
          sed -i 's/period-filter.js?v=1.3.0/period-filter.js?v=1.4.0/g' index.html
          sed -i 's/pptx-template-export.js?v=2.1.0/pptx-template-export.js?v=2.2.0/g' index.html
          sed -i 's/Версия v2.5.9/Версия v2.6.0/g' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
