name: Sync production files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Apply production changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          site_version = 'v2.6.5'
          new_label = 'Доступно для отгрузки клиенту-план'

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Загрузите 3 файла', 'Загрузите 2 файла')
          s = s.replace('План продаж, СММТ и PPTX-шаблон. Файлы сохраняются в браузере.', 'План продаж и PPTX-шаблон. Файлы сохраняются в браузере.')
          s = s.replace('0 / 3', '0 / 2')
          s = re.sub(r'\s*<label class="drop-card" id="smmtCard">.*?</label>\s*', '\n          ', s, count=1, flags=re.S)
          s = re.sub(r'(<label class="drop-card" id="templateCard">.*?<span class="file-index">)03(</span>)', r'\g<1>02\2', s, count=1, flags=re.S)
          s = re.sub(r'template-view\.js\?v=[^"\']+', 'template-view.js?v=2.6.0', s)
          s = re.sub(r'period-filter\.js\?v=[^"\']+', 'period-filter.js?v=1.7.0', s)
          s = re.sub(r'pptx-template-export\.js\?v=[^"\']+', 'pptx-template-export.js?v=2.6.0', s)
          s = re.sub(r'Версия v\d+\.\d+\.\d+', f'Версия {site_version}', s)
          p.write_text(s, encoding='utf-8')

          p = Path('template-view.js')
          s = p.read_text(encoding='utf-8')
          guard = """
          ;(()=>{
            const removeSmmt=()=>document.getElementById('smmtCard')?.remove();
            removeSmmt();
            new MutationObserver(removeSmmt).observe(document.body,{childList:true,subtree:true});
            const title=document.querySelector('#sources .source-title-row h2');
            const text=document.querySelector('#sources .source-title-row p');
            const index=document.querySelector('#templateCard .file-index');
            const counter=document.getElementById('readyBadge');
            if(title)title.textContent='Загрузите 2 файла';
            if(text)text.textContent='План продаж и PPTX-шаблон. Файлы сохраняются в браузере.';
            if(index)index.textContent='02';
            if(counter&&/3/.test(counter.textContent))counter.textContent=counter.textContent.replace('/ 3','/ 2');
            try{
              const req=indexedDB.open('atom-production-sales-plan',1);
              req.onsuccess=()=>{
                const db=req.result;
                if(!db.objectStoreNames.contains('files')){db.close();return}
                const tx=db.transaction('files','readwrite');
                tx.objectStore('files').delete('smmt');
                tx.oncomplete=()=>db.close();
                tx.onerror=()=>db.close();
              };
            }catch{}
          })();
          """
          if "const removeSmmt=()=>document.getElementById('smmtCard')?.remove();" not in s:
              s += guard
          p.write_text(s, encoding='utf-8')

          p = Path('period-filter.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Отгрузка клиенту ПЛАН', new_label)
          p.write_text(s, encoding='utf-8')

          p = Path('pptx-template-export.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Отгрузка клиенту ПЛАН', new_label)
          s = s.replace('    free:normalizeMetric(model.metrics?.free),\n', '    free:null,\n')
          s = s.replace('  if(/свободн.*сток|доступно.*конец|^доступно$/.test(s))return m.free;\n', '  if(/свободн.*сток|доступно.*конец|^доступно$/.test(s))return null;\n')
          s = s.replace("    ['Забронировано клиентами',m.booked,/забронировано/],\n    ['Свободный сток / доступно',m.free,/свободн.*сток|доступно/]\n", "    ['Забронировано клиентами',m.booked,/забронировано/]\n")
          s = s.replace("  changed+=setKpiNearLabel(doc,/^свободный сток$/,m.free);\n", '')
          s = re.sub(r"\+'_v2\.\d+\.pptx'", "+'_v2.6.pptx'", s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check template-view.js
          node --check period-filter.js
          node --check pptx-template-export.js
          node --check app.js
          node --check b2c-details.js

      - name: Commit production files
        run: |
          if git diff --quiet -- index.html template-view.js period-filter.js pptx-template-export.js; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html template-view.js period-filter.js pptx-template-export.js
          git commit -m "Sync production files v2.6.5"
          git push origin HEAD:main
